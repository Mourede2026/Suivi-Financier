<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi Finance ZS-DAA — Équipe</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16211C">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="entete-app">
  <div class="marque">
    <h1 id="nomEquipe">Équipe</h1>
    <span class="eyebrow">Suivi Finance ZS-DAA</span>
  </div>
  <div class="infos-session">
    <span id="indicateurReseau">● en ligne</span>
    <button class="bouton-discret" id="btnDeconnexion" style="color:var(--papier); border-color: rgba(244,239,224,0.3);">Déconnexion</button>
  </div>
</header>

<nav class="onglets">
  <button class="onglet actif" data-onglet="collecte">Collecte</button>
  <button class="onglet" data-onglet="dashboard">Mon tableau de bord</button>
</nav>

<div class="conteneur">

  <!-- ===================== ONGLET COLLECTE ===================== -->
  <section id="ongletCollecte">

    <div class="fiche">
      <div class="fiche-titre">
        <h2 class="mb-0" style="font-size:1.1rem;">Période de collecte</h2>
      </div>
      <div class="grille-3" style="align-items:end;">
        <div class="champ mb-0">
          <label for="selecteurMois">Mois à collecter</label>
          <input type="month" id="selecteurMois">
        </div>
        <div class="champ mb-0">
          <button class="bouton-brass" id="btnOuvrirPeriode">Ouvrir cette période</button>
        </div>
        <div class="champ mb-0" id="statutPeriode"></div>
      </div>
    </div>

    <div class="fiche">
      <div class="fiche-titre">
        <h2 class="mb-0" style="font-size:1.1rem;">Mes centres assignés</h2>
        <span class="texte-discret" id="compteurCentres"></span>
      </div>
      <div id="zoneFileAttente"></div>
      <div class="grille-centres" id="grilleCentres">
        <p class="texte-discret">Chargement des centres...</p>
      </div>
    </div>

  </section>

  <!-- ===================== ONGLET DASHBOARD ===================== -->
  <section id="ongletDashboard" class="cache">

    <div class="rangee-stats" id="statsEquipe"></div>

    <div class="fiche">
      <div class="fiche-titre">
        <h2 class="mb-0" style="font-size:1.1rem;">Cohérence par mois et par centre</h2>
      </div>
      <div style="overflow-x:auto;">
        <table id="tableDashboard">
          <thead>
            <tr>
              <th>Mois</th><th class="texte">Centre</th><th class="texte">Commune</th>
              <th>Écart</th><th>Écart versement</th><th>Statut</th>
            </tr>
          </thead>
          <tbody id="corpsTableDashboard"></tbody>
        </table>
      </div>
    </div>

  </section>

</div>

<!-- ===================== MODALE DE SAISIE ===================== -->
<div class="fond-modale cache" id="fondModale">
  <div class="modale">
    <div class="fiche-titre">
      <h2 class="mb-0" style="font-size:1.15rem;" id="titreModale">Saisie</h2>
      <button class="bouton-discret" id="btnFermerModale">Fermer</button>
    </div>

    <div id="messageModale"></div>

    <form id="formSaisie">
      <input type="hidden" id="centreIdActuel">
      <div class="grille-2">
        <div class="champ">
          <label>Solde début</label>
          <input type="number" step="0.01" id="soldeDebut" required>
        </div>
        <div class="champ">
          <label>Recette réalisée (livre caisse-recette)</label>
          <input type="number" step="0.01" id="recetteRealisee" required>
        </div>
        <div class="champ">
          <label>Recette déclarée (maniford)</label>
          <input type="number" step="0.01" id="recetteDeclaree" required>
        </div>
        <div class="champ">
          <label>Versement intégré</label>
          <input type="number" step="0.01" id="versementIntegre" required>
        </div>
        <div class="champ" style="grid-column: 1 / -1;">
          <label>Valeur physique comptée en fin de mois</label>
          <input type="number" step="0.01" id="valeurFinMois" required>
        </div>
      </div>

      <div class="champ">
        <label for="preuvePhoto">Preuve à l'appui (photo du livre de caisse)</label>
        <input type="file" id="preuvePhoto" accept="image/*" capture="environment">
        <p class="texte-discret" id="apercuFichier" style="margin-top:6px;"></p>
      </div>

      <button type="submit" class="bouton-principal bouton-pleine-largeur" id="btnEnregistrerSaisie">
        Enregistrer
      </button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/session.js"></script>
<script src="js/api.js"></script>
<script>
  const session = Session.exigerRole('equipe');
  let centres = [];
  let collectesEquipe = [];
  let moisActif = moisActuel();
  let preuveBase64 = null;

  if (session) {
    document.getElementById('nomEquipe').textContent = session.nom_equipe;
    document.getElementById('selecteurMois').value = moisActif;
    initialiser();
  }

  async function initialiser() {
    majIndicateurReseau();
    window.addEventListener('online', majIndicateurReseau);
    window.addEventListener('offline', majIndicateurReseau);

    await chargerCentres();
    await FileAttente.synchroniser();
    majFileAttenteAffichage();
    afficherCentres();
  }

  function majIndicateurReseau() {
    const el = document.getElementById('indicateurReseau');
    el.textContent = navigator.onLine ? '● en ligne' : '○ hors ligne';
    el.style.color = navigator.onLine ? '#8FCB9C' : '#E4A78F';
  }

  function majFileAttenteAffichage() {
    const n = FileAttente.taille();
    const zone = document.getElementById('zoneFileAttente');
    zone.innerHTML = n > 0
      ? `<div class="message message-erreur">${n} saisie(s) en attente de synchronisation (hors-ligne). Elles seront envoyées automatiquement dès le retour du réseau.</div>`
      : '';
  }

  async function chargerCentres() {
    const resultat = await appelerApi('getCentresEquipe');
    if (resultat.ok) centres = resultat.centres;
    document.getElementById('compteurCentres').textContent = centres.length + ' centre(s)';
  }

  async function chargerCollectes() {
    const resultat = await appelerApi('getCollectesEquipe');
    if (resultat.ok) collectesEquipe = resultat.collectes;
  }

  function statutCentrePourMois(centreId, mois) {
    const c = collectesEquipe.find(x => x.centre_id === centreId && String(x.mois) === mois);
    if (!c) return null;
    return c.balance;
  }

  function afficherCentres() {
    const grille = document.getElementById('grilleCentres');
    if (centres.length === 0) {
      grille.innerHTML = '<p class="texte-discret">Aucun centre ne t\'est encore assigné. Contacte l\'administrateur.</p>';
      return;
    }

    grille.innerHTML = centres.map(c => {
      const statut = statutCentrePourMois(c.id, moisActif);
      let tampon = '<span class="tampon tampon-attente">À faire</span>';
      if (statut === 'Bon') tampon = '<span class="tampon tampon-bon">Bon</span>';
      if (statut === 'Problème') tampon = '<span class="tampon tampon-probleme">Problème</span>';

      return `
        <div class="carte-centre" data-centre-id="${c.id}">
          <h3>${c.nom}</h3>
          <div class="commune">${c.commune} · ${c.arrondissement}</div>
          ${tampon}
        </div>`;
    }).join('');

    grille.querySelectorAll('.carte-centre').forEach(carte => {
      carte.addEventListener('click', () => ouvrirModale(carte.dataset.centreId));
    });
  }

  document.getElementById('selecteurMois').addEventListener('change', async (e) => {
    moisActif = e.target.value;
    await chargerCollectes();
    afficherCentres();
  });

  document.getElementById('btnOuvrirPeriode').addEventListener('click', async () => {
    const btn = document.getElementById('btnOuvrirPeriode');
    btn.disabled = true;
    const resultat = await appelerApi('ouvrirPeriode', { mois: moisActif });
    btn.disabled = false;
    const zone = document.getElementById('statutPeriode');
    if (resultat.ok) {
      zone.innerHTML = `<span class="tampon tampon-bon">${resultat.deja_ouverte ? 'Période déjà ouverte' : 'Période ouverte'}</span>`;
      await chargerCollectes();
      afficherCentres();
    } else {
      zone.innerHTML = `<span class="texte-discret" style="color:var(--tampon-probleme)">${resultat.error}</span>`;
    }
  });

  // ---------- Modale de saisie ----------

  function ouvrirModale(centreId) {
    const centre = centres.find(c => c.id === centreId);
    document.getElementById('titreModale').textContent = centre.nom + ' — ' + formaterMois(moisActif);
    document.getElementById('centreIdActuel').value = centreId;
    document.getElementById('messageModale').innerHTML = '';
    document.getElementById('apercuFichier').textContent = '';
    preuveBase64 = null;
    document.getElementById('formSaisie').reset();
    document.getElementById('centreIdActuel').value = centreId;

    // Pré-remplit si une saisie existe déjà pour ce mois.
    const existante = collectesEquipe.find(c => c.centre_id === centreId && String(c.mois) === moisActif);
    if (existante) {
      document.getElementById('soldeDebut').value = existante.solde_debut;
      document.getElementById('recetteRealisee').value = existante.recette_realisee;
      document.getElementById('recetteDeclaree').value = existante.recette_declaree;
      document.getElementById('versementIntegre').value = existante.versement_integre;
      document.getElementById('valeurFinMois').value = existante.valeur_fin_mois;
    }

    document.getElementById('fondModale').classList.remove('cache');
  }

  document.getElementById('btnFermerModale').addEventListener('click', () => {
    document.getElementById('fondModale').classList.add('cache');
  });

  document.getElementById('preuvePhoto').addEventListener('change', (e) => {
    const fichier = e.target.files[0];
    if (!fichier) return;
    const lecteur = new FileReader();
    lecteur.onload = () => {
      preuveBase64 = lecteur.result;
      document.getElementById('apercuFichier').textContent = 'Photo prête : ' + fichier.name;
    };
    lecteur.readAsDataURL(fichier);
  });

  document.getElementById('formSaisie').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnEnregistrerSaisie');
    btn.disabled = true;
    btn.textContent = 'Enregistrement...';

    const donnees = {
      centre_id: document.getElementById('centreIdActuel').value,
      mois: moisActif,
      solde_debut: document.getElementById('soldeDebut').value,
      recette_realisee: document.getElementById('recetteRealisee').value,
      recette_declaree: document.getElementById('recetteDeclaree').value,
      versement_integre: document.getElementById('versementIntegre').value,
      valeur_fin_mois: document.getElementById('valeurFinMois').value,
      preuve_base64: preuveBase64
    };

    const resultat = await saveCollecteAvecRepli(donnees);
    btn.disabled = false;
    btn.textContent = 'Enregistrer';

    const zoneMsg = document.getElementById('messageModale');
    if (!resultat.ok) {
      zoneMsg.innerHTML = `<div class="message message-erreur">${resultat.error}</div>`;
      return;
    }

    majFileAttenteAffichage();

    if (resultat.horsLigne) {
      zoneMsg.innerHTML = `<div class="message message-erreur">Pas de réseau : saisie mise en attente, elle sera envoyée automatiquement.</div>`;
      setTimeout(() => document.getElementById('fondModale').classList.add('cache'), 1600);
      return;
    }

    zoneMsg.innerHTML = `<div class="message message-succes">Enregistré — statut : ${resultat.balance}</div>`;
    await chargerCollectes();
    afficherCentres();
    setTimeout(() => document.getElementById('fondModale').classList.add('cache'), 900);
  });

  // ---------- Onglets ----------

  document.querySelectorAll('.onglet').forEach(bouton => {
    bouton.addEventListener('click', async () => {
      document.querySelectorAll('.onglet').forEach(b => b.classList.remove('actif'));
      bouton.classList.add('actif');
      const cible = bouton.dataset.onglet;
      document.getElementById('ongletCollecte').classList.toggle('cache', cible !== 'collecte');
      document.getElementById('ongletDashboard').classList.toggle('cache', cible !== 'dashboard');
      if (cible === 'dashboard') await afficherDashboard();
    });
  });

  async function afficherDashboard() {
    await chargerCollectes();

    const total = collectesEquipe.length;
    const bons = collectesEquipe.filter(c => c.balance === 'Bon').length;
    const problemes = total - bons;

    document.getElementById('statsEquipe').innerHTML = `
      <div class="stat"><div class="valeur">${total}</div><div class="libelle">Saisies au total</div></div>
      <div class="stat"><div class="valeur" style="color:var(--tampon-bon)">${bons}</div><div class="libelle">Statut Bon</div></div>
      <div class="stat"><div class="valeur" style="color:var(--tampon-probleme)">${problemes}</div><div class="libelle">Statut Problème</div></div>
    `;

    const centreParId = {};
    centres.forEach(c => centreParId[c.id] = c);

    const lignes = [...collectesEquipe].sort((a, b) => String(b.mois).localeCompare(String(a.mois)));

    document.getElementById('corpsTableDashboard').innerHTML = lignes.map(c => {
      const centre = centreParId[c.centre_id] || {};
      const tamponClasse = c.balance === 'Bon' ? 'tampon-bon' : 'tampon-probleme';
      return `<tr>
        <td>${formaterMois(c.mois)}</td>
        <td class="texte">${centre.nom || c.centre_id}</td>
        <td class="texte">${centre.commune || ''}</td>
        <td>${c.ecart}</td>
        <td>${c.ecart_versement}</td>
        <td><span class="tampon ${tamponClasse}">${c.balance}</span></td>
      </tr>`;
    }).join('') || '<tr><td colspan="6" class="texte texte-discret">Aucune saisie pour l\'instant.</td></tr>';
  }

  // ---------- Déconnexion ----------

  document.getElementById('btnDeconnexion').addEventListener('click', async () => {
    await appelerApi('logout');
    Session.effacer();
    window.location.href = 'index.html';
  });
</script>


<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
  }
</script>
</body>
</html>
